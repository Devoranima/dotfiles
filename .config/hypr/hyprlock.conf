general {
    ignore_empty_input = true
    text_trim = true
}


background {
    monitor = 
    path = screenshot   # supports png, jpg, webp (no animations, though)
    color = rgba(255, 255, 255, .1)

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_passes = 1 # 0 disables blurring
    blur_size = 30
    noise = 0.4
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.2696
    vibrancy_darkness = 0.0
}



input-field {
    monitor = DP-2
    size = 200, 50
    outline_thickness = 5
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgb(151515)
    inner_color = rgb(FFFFFF)
    font_color = rgb(10, 10, 10)
    fade_on_empty = false
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i></i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = 14 # -1 means complete rounding (circle/oval)
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34) # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
#    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color = rgb(240, 128, 0)
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below
    position = 0, -20
    halign = center
    valign = center
}

#TIME
label {
    monitor = 
    text = cmd[update:1000] echo "$TIME"
    color = rgba(200, 200, 200, 1.0)
    font_size = 100
    font_family = Fira Semibold
    position = -30, 100
    halign = right
    valign = bottom
}

# DATE 
label {
    monitor = 
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(200, 200, 200, 1.0)
    font_size = 25
    font_family = Fira Semibold
    position = -30, 50
    halign = right
    valign = bottom
}

#LAYOUT
label {
    monitor = 
    text = $LAYOUT
    color = rgba(200, 200, 200, 0.8)
    font_size = 50
    font_family = Fira Semibold
    position = -30, -50
    halign = right
    valign = top
    shadow_passes = 5
    shadow_size = 10
}


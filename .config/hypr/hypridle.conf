general {
    lock_cmd = pidof hyprlock | hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = hyprlock   # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to    key_press_enables_dpms=true press a key twice to turn on the display.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10000         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 900                                 # 5min
    on-timeout = hyprlock           # lock screen when timeout has passed
}



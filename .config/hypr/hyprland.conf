# Setup monitors
# See https://wiki.hyprland.org/Configuring/Monitors/

#monitor=eDP-1,2240x1440@60,0x0, 1
monitor=,preferred,auto,1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
exec-once = ~/.config/hypr/scripts/xdg-portal-hyprland # Make sure the correct portal is running
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # Wayland magic (screen sharing etc.)
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # More wayland magic (screen sharing etc.)
#exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 # used for user sudo graphical elevation
exec-once = systemctl --user start hyprpolkitagent
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = swww-daemon
exec-once = waybar # The top bar
exec-once = blueman-applet # Systray app for BT
exec-once = nm-applet --indicator # Systray app for Network/Wifi
exec-once = hypridle #Hyprland idle deamon start
exec = ~/.config/hypr/scripts/bgaction # Sets the background based on theme
exec-once = swayosd-server

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
exec-once = xrandr --output eDP-1 --primary

debug {
    disable_logs=false
}

input {
    kb_layout = us, ru
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle 
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
        drag_lock = yes
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 10
    border_size = 1
    # Hairline outlines: same hue as before (cdd6f4), just barely-there at
    # rest and brightening a bit on focus. No new color introduced.
    col.active_border = rgba(cdd6f466)
    col.inactive_border = rgba(cdd6f41a)

    layout = dwindle
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering=true
    key_press_enables_dpms=true
    middle_click_paste=false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 3

    # Soft, quiet depth instead of a border doing all the separation work
    shadow {
        enabled = true
        range = 10
        render_power = 2
        color = rgba(00000066)
        color_inactive = rgba(00000026)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
    }

    #blurls = lockscreen

}

# Same glass treatment on the bar/launcher/notifications so nothing looks
# like an opaque panel dropped on top of the desktop.
layerrule = blur, waybar
layerrule = blur, wofi
layerrule = blur, notifications
layerrule = blur, logout_dialog
layerrule = ignorezero, waybar
layerrule = ignorezero, wofi
layerrule = ignorezero, notifications
layerrule = ignorezero, logout_dialog

animations {
    enabled = yes

    # Quick, soft fade/scale so things arrive and dissolve rather than
    # slide in like UI chrome -- the "ephemeral" part.
    bezier = myBezier, 0.10, 0.9, 0.1, 1.05
    bezier = quietOut, 0.16, 1, 0.3, 1

    animation = windows, 1, 5, quietOut, popin 92%
    animation = windowsOut, 1, 4, myBezier, popin 92%
    animation = border, 1, 8, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, quietOut, fade
    animation = layers, 1, 3, quietOut, fade
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
#    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = master
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
#    workspace_swipe = off
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more

# Example windowrule v1
#windowrule = float on, ^(kitty)$
windowrule = float on,match:class ^(pavucontrol)$
windowrule = float on,match:class ^(blueman-manager)$
windowrule = float on,match:class ^(nm-connection-editor)$
windowrule = float on,match:class ^(chromium)$
windowrule = float on,match:class ^(thunar)$
windowrule = float on,match:title ^(btop)$
windowrule = float on,match:title ^(update-sys)$

# Example windowrule v2
# windowrule = float on,match:class ^(kitty)$,match:title ^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# kitty handles its own background_opacity (text stays fully opaque, only
# the backdrop is glassy) so it gets no compositor-level opacity rule here --
# stacking both is what makes a terminal unreadable. GTK apps don't have that
# per-pixel trick, so they keep only a light, legible translucency.
windowrule = animation popin,match:class ^(kitty)$,match:title ^(update-sys)$
windowrule = animation popin,match:class ^(thunar)$
windowrule = opacity 0.95 0.9,match:class ^(thunar)$
windowrule = opacity 0.96 0.92,match:class ^(VSCodium)$
windowrule = float on,match:class ^(VSCodium)$,match:title ^(Open .*)$
windowrule = float on,match:class ^(VSCodium)$,match:title ^(Save .*)$
windowrule = animation popin,match:class ^(firefox)$
windowrule = animation slide,match:class ^(wofi)$
windowrule = move 100%-433 53,match:class ^(wofi)$,match:title ^(clippick)$
windowrule = float on,match:title ^(nmtui)$
windowrule = size 600 400,match:title ^(nmtui)$
windowrule = center on,match:title ^(nmtui)$

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, kitty  # open the terminal
bind = $mainMod SHIFT, X, killactive, # close the active window
bind = $mainMod, L, exec, hyprlock # Lock the screen
bind = $mainMod, M, exec, wlogout --protocol layer-shell # show the logout window
bind = $mainMod SHIFT, M, exit, # Exit Hyprland all together no (force quit Hyprland)
bind = $mainMod, E, exec, thunar # Show the graphical file browser
bind = $mainMod, V, togglefloating, # Allow a window to float
bind = $mainMod, SPACE, exec, wofi # Show the graphical app launcher
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
#bind = $mainMod, S, exec, grim -g "$(slurp)" - | swappy -f - # take a screenshot
#bind = $mainMod, S, exec, grim -g "$(slurp)" $HOME/Pictures/Screenshots/$(date +'%s_grim.png')
$HYPRSHOT_DIR = "$HOME/Pictures/Screenshots/"
bind = $mainMod SHIFT, S, exec, hyprshot -m region
bind = , Print, exec, hyprshot -m output
bind = $mainMod CTRL, S, exec, hyprshot -m window
# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = $mainMod SHIFT, right, resizeactive, 20 0
bindel = $mainMod SHIFT, left, resizeactive, -20 0
bindel = $mainMod SHIFT, up, resizeactive, 0 -20
bindel = $mainMod SHIFT, down, resizeactive, 0 20

bindel = $mainMod CTRL, right, movewindow, r
bindel = $mainMod CTRL, left, movewindow, l 
bindel = $mainMod CTRL, up, movewindow, u
bindel = $mainMod CTRL, down, movewindow, d

# Toggle between floating/tiled windows
bind = $mainMod SHIFT, F, exec, sh ~/.config/hypr/scripts/toggle_float

bindl = , switch:on:Lid Switch, exec, loginctl lock-session && hyprctl dispatch dpms off
bindl = , switch:off:Lid Switch, exec, sleep 1 && hyprctl dispatch dpms on
# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf
#bind = ,XF86AudioMute, exec, pamixer -t # Speaker Mute FN+F1
#bind = ,XF86AudioLowerVolume, exec, pamixer -d 2 # Volume lower key
#bind = ,XF86AudioRaiseVolume, exec, pamixer -i 2 # Volume Higher key
bindl = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
binde = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume -2
binde = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume +2

bind = ,XF86AudioNext, exec, playerctl next
bind = ,XF86AudioPlay, exec, playerctl play-pause # Play/Pause key
bind = ,XF86AudioPrev, exec, playerctl previous
bind = ,XF86AudioMicMute, exec, pamixer --default-source -t

#bind = ,XF86MonBrightnessDown, exec, brightnessctl set 10%-
#bind = ,XF86MonBrightnessUp, exec, brightnessctl set 10%+

bind = ,XF86MonBrightnessDown, exec, swayosd-client --brightness -10
bind = ,XF86MonBrightnessUp, exec, swayosd-client --brightness  +10

bind = ,XF86Display, exec, wdisplays
bind = ,XF86WLAN, exec, nmcli radio wifi toggle
bind = ,XF86NotificationCenter, exec, bluetooth toggle
bind = ,XF86PickupPhone, exec, playerctl play-pause
#bind = ,XF86HangupPhone, exec, echo "HANGUP"
#bind = ,XF86Favorites, exec, echo "FAV"

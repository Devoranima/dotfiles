include ./waybar.conf
font_family      jetbrains mono nerd font
font_size        10
bold_font        auto
italic_font      auto
bold_italic_font auto
mouse_hide_wait  2.0
cursor_shape     block
url_color        #0087bd
url_style        dotted
#Close the terminal without confirmation
confirm_os_window_close 0
# kitty blends only the background per-pixel, so text stays crisp even with
# the window looking glassy -- a touch lighter than before, still legible.
background_opacity 0.9
dynamic_background_opacity yes
enable_audio_bell no

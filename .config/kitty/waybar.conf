# vim:ft=kitty
#
# Kitty theme matching the waybar config at ~/.config/waybar/style.css
# (neutral dark grayscale with a few muted accent colors)

# The basic colors
foreground              #c8c8c8
background              #1e1e1e
selection_foreground    #1e1e1e
selection_background    #c8c8c8

# Cursor colors
cursor                  #d8d8d8
cursor_text_color       #1e1e1e

# URL underline color when hovering with mouse
url_color               #c2c2c2

# Kitty window border colors
active_border_color     #767676
inactive_border_color   #565656
bell_border_color       #b0a0a0

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #1e1e1e
active_tab_background   #c8c8c8
inactive_tab_foreground #767676
inactive_tab_background #2a2a2a
tab_bar_background      #1e1e1e

# Colors for marks (marked text in the terminal)
mark1_foreground #1e1e1e
mark1_background #c8c8c8
mark2_foreground #1e1e1e
mark2_background #b3b3b3
mark3_foreground #1e1e1e
mark3_background #9db8a6

# The 16 terminal colors

# black
color0 #2a2a2a
color8 #565656

# red
color1 #b0a0a0
color9 #c98a8a

# green
color2  #a6b0a0
color10 #9db8a6

# yellow
color3  #b0aa8a
color11 #c2ba9d

# blue
color4  #a0a8b0
color12 #a8a8ae

# magenta
color5  #b0a0b0
color13 #c2a8c2

# cyan
color6  #a0b0b0
color14 #9dc2c2

# white
color7  #b8b8b8
color15 #dcdcdc
